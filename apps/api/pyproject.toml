[project]
name = "city-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy==2.0.52",
    "alembic==1.19.2",
    "psycopg[binary]==3.3.5",
    "pydantic-settings==2.15.0",
    "langgraph==1.2.11",
    "langchain-openai==1.6.2",
    "langchain-core==1.6.3",
    "structlog==26.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "pre-commit==4.6.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "playbooks*"]

# Markdown bodies must ship in wheels (not only editable source trees).
[tool.setuptools.package-data]
playbooks = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
