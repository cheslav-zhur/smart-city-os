# Tests run on push, not on every commit. Needs the API venv and Postgres.
default_install_hook_types: [pre-push]

repos:
  - repo: local
    hooks:
      - id: api-tests
        name: API tests
        language: system
        entry: ./scripts/run-api-tests.sh
        pass_filenames: false
        always_run: true
        stages: [pre-push]
