# Same gate as scripts/run-api-tests.sh (pre-push): sim + migrate + API pytest.
# No live LLM. Web vitest stays local until V1-U6 thickens the console tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API and sim tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: city
          POSTGRES_PASSWORD: city
          POSTGRES_DB: city
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U city -d city"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://city:city@localhost:5432/city
      AUDIT_ACTOR: demo-operator
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API package
        working-directory: apps/api
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e '.[dev]'

      - name: Run sim and API tests
        run: ./scripts/run-api-tests.sh
