services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: city
      POSTGRES_PASSWORD: city
      POSTGRES_DB: city
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U city -d city"]
      interval: 5s
      timeout: 5s
      retries: 10

  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
      - pip_cache:/cache/pip
      - pnpm_cache:/cache/pnpm
      - uv_cache:/cache/uv
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://city:city@postgres:5432/city
      PIP_CACHE_DIR: /cache/pip
      npm_config_store_dir: /cache/pnpm
      UV_CACHE_DIR: /cache/uv

  # Demo path only (`docker compose --profile demo up postgres api worker web`).
  # Daily work stays in `dev` via Makefile — do not run both listeners on 8000/5173.
  api:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
      - pip_cache:/cache/pip
      - pnpm_cache:/cache/pnpm
      - uv_cache:/cache/uv
    working_dir: /workspace/apps/api
    command: [".venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://city:city@postgres:5432/city
      PIP_CACHE_DIR: /cache/pip
      UV_CACHE_DIR: /cache/uv
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
      - pip_cache:/cache/pip
      - pnpm_cache:/cache/pnpm
      - uv_cache:/cache/uv
    working_dir: /workspace/apps/api
    command: [".venv/bin/python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://city:city@postgres:5432/city
      PIP_CACHE_DIR: /cache/pip
      UV_CACHE_DIR: /cache/uv
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
      - pnpm_cache:/cache/pnpm
    working_dir: /workspace/apps/web
    command: ["pnpm", "dev"]
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
      npm_config_store_dir: /cache/pnpm
    depends_on:
      - api

volumes:
  postgres_data:
  pip_cache:
  pnpm_cache:
  uv_cache:
